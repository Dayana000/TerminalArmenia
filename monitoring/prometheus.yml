global:
  scrape_interval: 10s # Con qué frecuencia Prometheus buscará nuevos datos

scrape_configs:
  - job_name: 'terminal-armenia-aws'
    scheme: https
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['terminal-armenia.freeddns.org']

  - job_name: 'terminal-armenia-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:5000'] # Apunta a tu app Spring Boot corriendo en tu máquina local
