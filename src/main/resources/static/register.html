<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Terminal Armenia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-brand">
        <div class="logo-ring">🚌</div>
        <h1>Terminal Armenia</h1>
        <p>Sistema Digital de Gestion de Tiquetes</p>
    </div>

    <!-- PASO 1: Formulario de registro -->
    <div class="auth-card" id="stepRegister">
        <h2>Crear Cuenta</h2>
        <p class="subtitle">Registra un nuevo usuario en el sistema</p>

        <div class="form-group">
            <label>Nombre completo</label>
            <input id="name" type="text" placeholder="Ej. Maria Garcia Lopez">
        </div>

        <div class="form-group">
            <label>Correo electronico</label>
            <input id="email" type="email" placeholder="tu@correo.com">
        </div>

        <div class="form-group">
            <label>Contrasena</label>
            <input id="password" type="password" placeholder="Minimo 8 caracteres, una letra y un numero">
        </div>

        <div class="form-group">
            <label>Confirmar contrasena</label>
            <input id="passwordConfirm" type="password" placeholder="Repite tu contrasena">
        </div>


        <button class="btn btn-primary" id="registerBtn" onclick="register()">
            <span id="btnText">Crear Cuenta</span>
            <span id="btnSpinner" class="spinner" style="display:none;"></span>
        </button>

        <p class="link-line">Ya tienes cuenta? <a href="login.html">Inicia sesion aqui</a></p>
    </div>

    <!-- PASO 2: Verificar codigo -->
    <div class="auth-card" id="stepVerify" style="display:none">
        <div style="text-align:center;margin-bottom:20px">
            <div style="font-size:48px;margin-bottom:8px">📧</div>
            <h2>Verifica tu correo</h2>
            <p class="subtitle">Enviamos un codigo de 6 digitos a<br><strong id="emailDisplay"></strong></p>
        </div>

        <div class="form-group">
            <label>Codigo de verificacion</label>
            <input id="verifyCode" type="text" maxlength="6" placeholder="000000"
                   style="text-align:center;font-size:28px;font-weight:800;letter-spacing:10px;font-family:monospace">
        </div>

        <button class="btn btn-primary" id="verifyBtn" onclick="verifyCode()">
            <span id="verifyBtnText">Verificar Codigo</span>
            <span id="verifySpinner" class="spinner" style="display:none;"></span>
        </button>

        <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted)">
            No recibiste el correo?
            <a href="#" onclick="resendCode()" style="color:var(--accent)">Reenviar codigo</a>
        </p>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="utils.js"></script>
<script src="register.js"></script>
</body>
</html>
